<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none" role="img" aria-label="Budget d'un projet">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <circle cx="240" cy="140" r="220" fill="#ffffff" opacity="0.10" filter="url(#soft2)"/>
  <circle cx="1000" cy="600" r="220" fill="#0b1220" opacity="0.12" filter="url(#soft2)"/>
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
    <path d="M0 168.75 H1200 M0 337.5 H1200 M0 506.25 H1200 M200 0 V675 M400 0 V675 M600 0 V675 M800 0 V675 M1000 0 V675"/>
  </g>
  <!-- Histogramme croissant -->
  <g>
    <rect x="690" y="430" width="80" height="110" rx="12" fill="#ffffff" opacity="0.55"/>
    <rect x="800" y="360" width="80" height="180" rx="12" fill="#ffffff" opacity="0.75"/>
    <rect x="910" y="270" width="80" height="270" rx="12" fill="#ffffff"/>
    <path d="M690 405 L810 320 L950 235" stroke="#a7f3d0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="950" cy="235" r="12" fill="#a7f3d0"/>
  </g>
  <!-- Piece euro -->
  <g transform="translate(320 340)">
    <circle r="130" fill="#ffffff"/>
    <circle r="130" fill="#0b1220" opacity="0.04"/>
    <circle r="104" fill="none" stroke="#3b82f6" stroke-width="6" stroke-dasharray="3 16" stroke-linecap="round"/>
    <text x="0" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#3b82f6" text-anchor="middle">€</text>
  </g>
  <!-- Petites pieces -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="470" cy="520" rx="46" ry="16"/>
    <ellipse cx="470" cy="505" rx="46" ry="16" opacity="0.9"/>
    <ellipse cx="470" cy="490" rx="46" ry="16"/>
  </g>
</svg>
